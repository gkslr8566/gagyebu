<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>var __SELF_URL = null; /* GitHub Pages 판: 서버 주소는 ⚙ 설정에 입력 */</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>재정관리</title>
<!-- 휴대폰 홈 화면에 추가했을 때 브라우저 주소창 없이 앱처럼(standalone) 열리도록 하는 메타 태그.
     Index.html(Apps Script로 서빙되는 버전)에서는 아래 스크립트가 manifest.json 링크도 동적으로 추가한다. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="재정관리">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#232326">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<div id="boot" style="font-family:-apple-system,sans-serif;color:#6b7280;text-align:center;padding:40vh 16px 0;">불러오는 중…</div>
<script>
// 화면 조각들을 순서대로 받아서 하나로 합친다. (조각으로 나눠 두면 고칠 때 바뀐 조각만 올리면 됨)
(function () {
  var CSS = ["part-css-01.txt", "part-css-02.txt", "part-css-03.txt"];
  var HTML = ["part-html-01.txt", "part-html-02.txt", "part-html-03.txt"];
  var JS = ["part-js-01.txt", "part-js-02.txt", "part-js-03.txt", "part-js-04.txt", "part-js-05.txt", "part-js-06.txt", "part-js-07.txt", "part-js-08.txt", "part-js-09.txt", "part-js-10.txt", "part-js-11.txt", "part-js-12.txt", "part-js-13.txt", "part-js-14.txt", "part-js-15.txt", "part-js-16.txt", "part-js-17.txt", "part-js-18.txt", "part-js-19.txt", "part-js-20.txt"];
  function get(u) {
    return fetch(u, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(u + ' (' + r.status + ')');
      return r.text();
    });
  }
  Promise.all([Promise.all(CSS.map(get)), Promise.all(HTML.map(get)), Promise.all(JS.map(get))]).then(function (res) {
    var st = document.createElement('style'); st.textContent = res[0].join(''); document.head.appendChild(st);
    var boot = document.getElementById('boot'); if (boot) boot.remove();
    document.body.insertAdjacentHTML('afterbegin', res[1].join(''));
    var s = document.createElement('script'); s.textContent = res[2].join(''); document.body.appendChild(s);
  }).catch(function (e) {
    var boot = document.getElementById('boot');
    if (boot) boot.textContent = '화면을 불러오지 못했어요. 인터넷 연결을 확인하고 앱을 다시 열어 주세요. (' + e.message + ')';
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('서비스 워커 등록 실패', e); });
    });
  }
})();
</script>
</body>
</html>
